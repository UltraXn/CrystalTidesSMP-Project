sonar.projectKey=crystaltides
sonar.projectName=CrystalTides
sonar.projectVersion=1.0.0
sonar.host.url=http://localhost:9000

# Seguridad: Cargar el token desde variable de entorno SONAR_TOKEN en CI o entorno local
# sonar.token=${env:SONAR_TOKEN}

# Fuentes explícitas (excluyendo artefactos de build y dependencias)
sonar.sources=apps/web-client/src,apps/web-server/app.ts,apps/web-server/index.ts,apps/web-server/config,apps/web-server/controllers,apps/web-server/routes,apps/web-server/services,apps/web-server/middleware,apps/web-server/types,apps/web-server/utils,apps/web-server/schemas
sonar.sourceEncoding=UTF-8

# Optimizado para Docker WSL2 (3GB heap)
sonar.typescript.tsconfigPaths=apps/web-client/tsconfig.json,apps/web-server/tsconfig.json
sonar.javascript.node.maxspace=3072
sonar.javascript.node.debugMemory=false

# Exclusiones estrictas
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/target/**,**/.turbo/**,**/.wrangler/**,**/.next/**,**/.tgrep/**,**/graphify-out/**,**/.git/**,**/*.min.js,**/*.bundle.*,**/apps/launcher/**,**/.agents/**,**/mcp-servers/**,**/public/**,**/vendor/**,**/*.json,**/*.md,**/*.log,**/.eslintcache,**/reports/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**

# Tests
sonar.tests=apps/web-client/src/__tests__,apps/web-server/__tests__
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**
