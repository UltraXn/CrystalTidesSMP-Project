sonar.projectKey=crystaltides
sonar.projectName=CrystalTides
sonar.projectVersion=1.0.0
sonar.host.url=http://localhost:9000

# Fuentes explícitas (excluyendo artefactos de build y dependencias)
sonar.sources=apps/web-client/src,apps/web-server/app.ts,apps/web-server/index.ts,apps/web-server/config,apps/web-server/controllers,apps/web-server/routes,apps/web-server/services,apps/web-server/middleware,apps/web-server/types,apps/web-server/utils,apps/web-server/schemas,apps/launcher-lite/src,apps/launcher-lite/src-tauri/src,apps/game-bridge/native-core/src,apps/game-bridge/java-agent/src/main/java,plugins/crystalcore/src/main/java,mods/crystaltides-boost/common/src/main/java,mods/crystaltides-boost/fabric/src/main/java,mods/crystaltides-boost/neoforge/src/main/java
sonar.sourceEncoding=UTF-8

# Java bytecode para reglas de análisis estático avanzado
sonar.java.binaries=plugins/crystalcore/target/classes,apps/game-bridge/java-agent/target/classes,mods/crystaltides-boost/target/classes

# Optimizado para ejecución nativa TypeScript / React
sonar.typescript.tsconfigPaths=apps/web-client/tsconfig.json,apps/web-server/tsconfig.json,apps/launcher-lite/tsconfig.json
sonar.javascript.node.maxspace=4608
sonar.javascript.node.debugMemory=false
sonar.scm.disabled=true

# Exclusiones estrictas
sonar.exclusions=**/node_modules/**,**/dist/**,**/dist-package/**,**/build/**,**/coverage/**,**/target/**,**/.turbo/**,**/.wrangler/**,**/.next/**,**/.tgrep/**,**/graphify-out/**,**/.git/**,**/*.min.js,**/*.bundle.*,**/.agents/**,**/mcp-servers/**,**/public/**,**/vendor/**,**/*.json,**/*.md,**/*.log,**/.eslintcache,**/reports/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**

# Tests
sonar.tests=apps/web-client/src/__tests__,apps/web-server/__tests__,apps/launcher-lite/src/__tests__,plugins/crystalcore/src/test/java
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**,**/Test*.java,**/*Test.java

# Reportes de Cobertura LCOV y JaCoCo
sonar.javascript.lcov.reportPaths=apps/web-client/coverage/lcov.info,apps/web-server/coverage/lcov.info,apps/launcher-lite/coverage/lcov.info,apps/launcher/client/coverage/lcov.info
sonar.coverage.jacoco.xmlReportPaths=plugins/crystalcore/target/site/jacoco/jacoco.xml,apps/game-bridge/java-agent/target/site/jacoco/jacoco.xml,mods/crystaltides-boost/target/site/jacoco/jacoco.xml

