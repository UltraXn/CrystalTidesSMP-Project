[package]
name = "game_bridge_core"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# log and simple_logger for debugging within the game process
log = "0.4"
simple_logger = "4.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Graphics_OpenGL",
    "Win32_Graphics_Gdi",
] }

