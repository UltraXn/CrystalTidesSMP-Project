server {
    listen 80;
    
    root /usr/share/nginx/html;

    # Ocultar versión de Nginx (Previene fingerprinting)
    server_tokens off;

    # Límite de carga de payload (Defensa contra DoS por memoria)
    client_max_body_size 15M;

    # =========================================================================
    # HEADERS DE SEGURIDAD (Vibecoder 27-Point & Global Standard)
    # =========================================================================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # =========================================================================
    # HEALTH CHECK (Kubernetes / Docker Swarm / GCP Probes)
    # =========================================================================
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # =========================================================================
    # ANTI-FUZZING & DEFENSIVE SECURITY (Estándar Global AGENTS.md)
    # Descartar con 404 Not Found escaneos automáticos de dotfiles y volcados
    # =========================================================================

    # 1. Permitir .well-known exclusivamente para validaciones SSL / ACME / WebFinger
    location ^~ /.well-known/ {
        allow all;
    }

    # 2. Descartar con 404 escaneos hacia cualquier dotfile oculto (/.git, /.env, etc.)
    location ~ /\. {
        access_log off;
        log_not_found off;
        return 404;
    }

    # 3. Descartar con 404 escaneos hacia volcados, claves, logs y respaldos
    location ~* \.(?:env.*|bak|sql|db|sqlite\d*|key|pem|crt|log|tmp|conf|ini|yaml|yml|orig|save|dist)$ {
        access_log off;
        log_not_found off;
        return 404;
    }

    # =========================================================================
    # SPA ROUTING (React Router / Vite)
    # =========================================================================
    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Evitar caché en index.html para reflejar despliegues inmediatamente
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Caché inmutable para assets estáticos con fingerprint de Vite
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf|otf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # =========================================================================
    # REVERSE PROXY API (Hacia backend Express)
    # =========================================================================
    location /api {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Ocultar headers de tecnología interna del backend
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }
}
