    <!-- Schema.org JSON-LD Structured Data for Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "VideoGame",
      "name": "CrystalTides SMP",
      "description": "Servidor de Minecraft Java Edition (1.21+) con supervivencia, comunidad, eventos y experiencias personalizadas.",
      "url": "https://crystaltidessmp.net",
      "genre": ["Survival", "SMP", "Multiplayer"],
      "gamePlatform": ["PC", "Java Edition"],
      "inLanguage": "es",
      "author": {
        "@type": "Organization",
        "name": "CrystalTides SMP Team",
        "url": "https://crystaltidessmp.net"
      }
    }
    </script>
  </head>

  <body>
    <div id="root">
      <style>
        body {
          margin: 0;
          padding: 0;
          background-color: #0b0c10;
          color: #89d9d1;
          font-family: system-ui, -apple-system, sans-serif;
        }
        .loader-fullscreen-initial {
          position: fixed;
          inset: 0;
          z-index: 9999;
          background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a0f 100%);
          backdrop-filter: blur(25px);
          -webkit-backdrop-filter: blur(25px);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          user-select: none;
          perspective: 1000px;
        }
        .loader-visual-wrapper {
          position: relative;
          width: 200px;
          height: 200px;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 2rem;
          transform-style: preserve-3d;
        }
        .prism-container {
          position: relative;
          width: 100px;
          height: 100px;
          z-index: 5;
          transform-style: preserve-3d;
          animation: prism-rotate 12s linear infinite;
        }
        .prism-glass {
          position: absolute;
          inset: -15px;
          background: rgba(255, 255, 255, 0.03);
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          border: 1px solid rgba(255, 255, 255, 0.08);
          border-radius: 24px;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), inset 0 0 15px rgba(255, 255, 255, 0.05);
          z-index: 2;
          overflow: hidden;
        }
        .prism-glass::before {
          content: '';
          position: absolute;
          inset: 0;
          background: linear-gradient(135deg, transparent 0%, rgba(255, 255, 255, 0.05) 40%, rgba(255, 255, 255, 0.1) 50%, rgba(255, 255, 255, 0.05) 60%, transparent 100%);
          transform: translateX(-100%) skewX(-15deg);
          animation: prism-shimmer 3s ease-in-out infinite;
        }
        .loader-logo-wrapper {
          width: 70px;
          height: 70px;
          position: relative;
          z-index: 3;
          animation: logo-float 4s ease-in-out infinite;
          filter: drop-shadow(0 0 15px rgba(137, 217, 209, 0.5));
        }
        .loader-logo-wrapper img {
          width: 100%;
          height: 100%;
          object-fit: contain;
        }
        .prism-rays {
          position: absolute;
          inset: -50px;
          z-index: 1;
        }
        .ray {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 2px;
          height: 120px;
          background: linear-gradient(to top, #89d9d1, transparent);
          transform-origin: bottom center;
          opacity: 0;
          filter: blur(1px);
        }
        .ray-1 { transform: translate(-50%, -100%) rotate(0deg); animation: ray-flash 2.5s ease-in-out infinite 0s; }
        .ray-2 { transform: translate(-50%, -100%) rotate(72deg); animation: ray-flash 2.5s ease-in-out infinite 0.5s; }
        .ray-3 { transform: translate(-50%, -100%) rotate(144deg); animation: ray-flash 2.5s ease-in-out infinite 1s; }
        .ray-4 { transform: translate(-50%, -100%) rotate(216deg); animation: ray-flash 2.5s ease-in-out infinite 1.5s; }
        .ray-5 { transform: translate(-50%, -100%) rotate(288deg); animation: ray-flash 2.5s ease-in-out infinite 2s; }
        .particles {
          position: absolute;
          inset: -40px;
          pointer-events: none;
        }
        .particle {
          position: absolute;
          width: 4px;
          height: 4px;
          background: #89d9d1;
          border-radius: 50%;
          filter: blur(1px);
          box-shadow: 0 0 10px #89d9d1;
        }
        .p1 { top: 10%; left: 10%; animation: p-orbit 5s linear infinite; }
        .p2 { top: 80%; left: 20%; animation: p-orbit 7s linear infinite reverse; }
        .p3 { top: 40%; left: 90%; animation: p-orbit 6s linear infinite; }
        .p4 { top: 70%; left: 70%; animation: p-orbit 8s linear infinite reverse; }
        .loader-text-premium {
          font-size: 0.85rem;
          font-weight: 800;
          color: rgba(255, 255, 255, 0.7);
          text-transform: uppercase;
          letter-spacing: 5px;
          text-shadow: 0 0 20px rgba(137, 217, 209, 0.3);
        }
        .loader-subtitle {
          font-size: 0.7rem;
          color: rgba(255, 255, 255, 0.3);
          margin-top: 0.5rem;
          letter-spacing: 2px;
        }
        @keyframes prism-rotate {
          0% { transform: rotateY(0deg) rotateX(0deg); }
          100% { transform: rotateY(360deg) rotateX(10deg); }
        }
        @keyframes prism-shimmer {
          0% { transform: translateX(-100%) skewX(-15deg); }
          50%, 100% { transform: translateX(150%) skewX(-15deg); }
        }
        @keyframes logo-float {
          0%, 100% { transform: translateZ(20px) translateY(0); }
          50% { transform: translateZ(35px) translateY(-8px); }
        }
        @keyframes ray-flash {
          0%, 100% { opacity: 0; height: 80px; }
          50% { opacity: 0.4; height: 140px; }
        }
        @keyframes p-orbit {
          0% { transform: rotate(0deg) translateX(80px) rotate(0deg); opacity: 0; }
          20%, 80% { opacity: 1; }
          100% { transform: rotate(360deg) translateX(80px) rotate(-360deg); opacity: 0; }
        }
      </style>
      <div class="loader-fullscreen-initial">
        <div class="loader-visual-wrapper">
          <div class="prism-container">
            <div class="prism-glass">
              <div class="loader-logo-wrapper">
                <img src="/images/ui/logo.webp" alt="Crystal Tides" width="70" height="70" />
              </div>
            </div>
          </div>
          <div class="prism-rays">
            <div class="ray ray-1"></div>
            <div class="ray ray-2"></div>
            <div class="ray ray-3"></div>
            <div class="ray ray-4"></div>
            <div class="ray ray-5"></div>
          </div>
          <div class="particles">
            <div class="particle p1"></div>
            <div class="particle p2"></div>
            <div class="particle p3"></div>
            <div class="particle p4"></div>
          </div>
        </div>
        <div class="loader-text-wrapper">
          <div class="loader-text-premium">CARGANDO CONTENIDO...</div>
          <div class="loader-subtitle">POR FAVOR ESPERA...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
