<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/images/ui/logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CrystalTides SMP: Servidor de Minecraft Java Edition con comunidad, aventuras y diversión. ¡Únete a la mejor experiencia SMP!"
    />
    <meta
      property="og:title"
      content="CrystalTides SMP - Servidor de Minecraft"
    />
    <meta
      property="og:description"
      content="Únete a la mejor comunidad de Minecraft SMP. Aventuras, eventos y diversión sin límites."
    />
    <meta property="og:image" content="/images/ui/logo.png" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0F969C" />
    <title>CrystalTides SMP</title>
  </head>

  <body>
    <div id="root">
      <style>
        :root {
          --accent: #89d9d1;
          --accent-rgb: 137, 217, 209;
          --glass-bg: rgba(255, 255, 255, 0.03);
          --glass-border: rgba(255, 255, 255, 0.08);
        }
        body {
          margin: 0;
          padding: 0;
          background-color: #0b0c10;
          overflow: hidden;
        }
        .initial-loading-screen {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          width: 100vw;
          background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a0f 100%);
          color: #89d9d1;
          font-family: 'Outfit', system-ui, -apple-system, sans-serif;
          position: fixed;
          inset: 0;
          z-index: 9999;
          perspective: 1000px;
        }
        
        .loader-visual-wrapper {
          position: relative;
          width: 200px;
          height: 200px;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 3rem;
          transform-style: preserve-3d;
        }

        .prism-container {
          position: relative;
          width: 100px;
          height: 100px;
          z-index: 5;
          transform-style: preserve-3d;
          animation: prism-rotate 12s linear infinite;
        }

        .prism-glass {
          position: absolute;
          inset: -15px;
          background: var(--glass-bg);
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          border: 1px solid var(--glass-border);
          border-radius: 24px;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 
            0 8px 32px 0 rgba(0, 0, 0, 0.37),
            inset 0 0 15px rgba(255, 255, 255, 0.05);
          z-index: 2;
          overflow: hidden;
        }

        .prism-glass::before {
          content: '';
          position: absolute;
          inset: 0;
          background: linear-gradient(
            135deg,
            transparent 0%,
            rgba(255, 255, 255, 0.05) 40%,
            rgba(255, 255, 255, 0.1) 50%,
            rgba(255, 255, 255, 0.05) 60%,
            transparent 100%
          );
          transform: translateX(-100%) skewX(-15deg);
          animation: prism-shimmer 3s ease-in-out infinite;
        }

        .loader-logo-wrapper {
          width: 70px;
          height: 70px;
          position: relative;
          z-index: 3;
          animation: logo-float 4s ease-in-out infinite;
          filter: drop-shadow(0 0 15px rgba(137, 217, 209, 0.5));
        }

        .loader-logo-wrapper img {
          width: 100%;
          height: 100%;
          object-fit: contain;
        }

        .prism-rays {
          position: absolute;
          inset: -50px;
          z-index: 1;
        }

        .ray {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 2px;
          height: 120px;
          background: linear-gradient(to top, var(--accent), transparent);
          transform-origin: bottom center;
          opacity: 0;
          filter: blur(1px);
        }

        .ray-1 { transform: translate(-50%, -100%) rotate(0deg); animation: ray-flash 2.5s ease-in-out infinite 0s; }
        .ray-2 { transform: translate(-50%, -100%) rotate(72deg); animation: ray-flash 2.5s ease-in-out infinite 0.5s; }
        .ray-3 { transform: translate(-50%, -100%) rotate(144deg); animation: ray-flash 2.5s ease-in-out infinite 1s; }
        .ray-4 { transform: translate(-50%, -100%) rotate(216deg); animation: ray-flash 2.5s ease-in-out infinite 1.5s; }
        .ray-5 { transform: translate(-50%, -100%) rotate(288deg); animation: ray-flash 2.5s ease-in-out infinite 2s; }

        .loader-text-premium {
          font-family: inherit;
          font-size: 0.9rem;
          font-weight: 800;
          color: rgba(255, 255, 255, 0.7);
          text-transform: uppercase;
          letter-spacing: 5px;
          margin-top: 1rem;
          position: relative;
          text-shadow: 0 0 20px rgba(var(--accent-rgb), 0.3);
        }

        @keyframes prism-rotate {
          0% { transform: rotateY(0deg) rotateX(0deg); }
          100% { transform: rotateY(360deg) rotateX(10deg); }
        }

        @keyframes prism-shimmer {
          0% { transform: translateX(-100%) skewX(-15deg); }
          50%, 100% { transform: translateX(150%) skewX(-15deg); }
        }

        @keyframes logo-float {
          0%, 100% { transform: translateZ(20px) translateY(0); }
          50% { transform: translateZ(35px) translateY(-8px); }
        }

        @keyframes ray-flash {
          0%, 100% { opacity: 0; height: 80px; }
          50% { opacity: 0.4; height: 140px; }
        }

      </style>
      <div class="initial-loading-screen">
        <div class="loader-visual-wrapper">
          <div class="prism-container">
            <div class="prism-glass">
              <div class="loader-logo-wrapper">
                <img src="/images/ui/logo.webp" alt="CrystalTides" />
              </div>
            </div>
          </div>
          <div class="prism-rays">
            <div class="ray ray-1"></div>
            <div class="ray ray-2"></div>
            <div class="ray ray-3"></div>
            <div class="ray ray-4"></div>
            <div class="ray ray-5"></div>
          </div>
        </div>
        <div class="loader-text-premium">Cargando experiencia</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
