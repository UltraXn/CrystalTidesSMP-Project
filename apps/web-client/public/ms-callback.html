<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Autenticando con CrystalTides SMP...</title>
  <style>
    body {
      background-color: #09090b;
      color: #34d399;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(52, 211, 153, 0.15);
      border-top-color: #34d399;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .title {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
    }
    .sub {
      font-size: 11px;
      color: #a1a1aa;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="title">Vinculando Cuenta...</div>
  <div class="sub">Por favor espera un momento</div>

  <script>
    (function() {
      try {
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");
        const error = params.get("error_description") || params.get("error");

        if (window.opener && !window.opener.closed) {
          if (code) {
            window.opener.postMessage({ type: "MS_AUTH_CODE", code: code }, "*");
          } else if (error) {
            window.opener.postMessage({ type: "MS_AUTH_ERROR", error: error }, "*");
          }
        }
      } catch (err) {
        console.error("Callback error:", err);
      } finally {
        setTimeout(function() {
          window.close();
        }, 150);
      }
    })();
  </script>
</body>
</html>
