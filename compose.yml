version: '3.8'

services:
  # 🗄️ Database for Pelican Panel
  database:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_DATABASE: pelican
      MYSQL_USER: pelican
      MYSQL_PASSWORD: pelican_db_password_change_me
      MYSQL_ROOT_PASSWORD: pelican_root_password_change_me
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - pelican-network

  # ⚡ Redis Cache & Queue
  cache:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - pelican-network

  # 🦅 Pelican Panel Web Application
  panel:
    image: ghcr.io/pelican-dev/panel:latest
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_URL: https://panel.crystaltidessmp.net
      BEHIND_PROXY: 'true'
      APP_NAME: "CrystalTides SMP"
      APP_LOGO: "https://crystaltidessmp.net/images/ui/logo.webp"
      TRUSTED_PROXIES: 172.16.0.0/12 # ponytail: Docker bridge range
      APP_TIMEZONE: America/Santiago
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: pelican
      DB_USERNAME: pelican
      DB_PASSWORD: pelican_db_password_change_me
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: cache
    volumes:
      - panel-data:/var/www/html/storage
      - ./memory-limit.ini:/usr/local/etc/php/conf.d/memory-limit.ini
    depends_on:
      - database
      - cache
    networks:
      - pelican-network

  # 🗺️ FRP Server (Fast Reverse Proxy)
  frps:
    image: fatedier/frps:v0.54.0
    restart: always
    ports:
      - '7000:7000' # FRP Control port (frpc connects here)
      - '25565:25565' # Minecraft proxy port (players connect here)
      - '8023:8023' # Local Spy proxy port (Discord Bot connects here)
      - '8022:8022' # Laptop SSH proxy port (Discord Bot connects here)
      - '2022:2022' # Wings SFTP proxy port (WinSCP connects here)
    volumes:
      - ./frps.toml:/etc/frp/frps.toml
    command: -c /etc/frp/frps.toml
    networks:
      - pelican-network

  # 🔑 HashiCorp Vault (Secrets Manager)
  vault:
    image: hashicorp/vault:1.15.0
    container_name: crystaltides-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: crystaltides-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    command: server -dev -dev-listen-address=0.0.0.0:8200
    volumes:
      - vault-data:/vault/file
    restart: always
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pelican-network

  # 🤖 Discord Bot
  bot:
    image: crystaltides-bot:latest
    container_name: crystaltides-bot
    user: "1001:1001"
    environment:
      PORT: 3002
      NODE_ENV: production
    env_file:
      - .env.bot
    volumes:
      - ./id_minecraft_pem:/app/id_minecraft_pem:ro
    restart: always
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pelican-network

  # 🔒 Caddy (Automated SSL Reverse Proxy)
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - panel
    networks:
      - pelican-network

networks:
  pelican-network:
    name: pelican-network

volumes:
  db-data:
  redis-data:
  panel-data:
  caddy-data:
  caddy-config:
  vault-data:
