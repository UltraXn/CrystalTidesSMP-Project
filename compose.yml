services:
  # 🗄️ Database for Pelican Panel
  database:
    image: mariadb:10.11
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      MYSQL_DATABASE: pelican
      MYSQL_USER: pelican
      MYSQL_PASSWORD: ${PELICAN_DB_PASSWORD:?PELICAN_DB_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${PELICAN_ROOT_PASSWORD:?PELICAN_ROOT_PASSWORD must be set}
    volumes:
      - db-data:/var/lib/mysql
    mem_limit: 1g
    cpus: 1.50
    pids_limit: 256
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mariadb-admin ping -h 127.0.0.1 -u root --password=$$MYSQL_ROOT_PASSWORD || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - pelican-network

  # ⚡ Redis Cache & Queue
  cache:
    image: redis:7-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - redis-data:/data
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 128
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep PONG || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - pelican-network

  # 🦅 Pelican Panel Web Application
  panel:
    image: ghcr.io/pelican-dev/panel:1.0.0
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_URL: https://panel.crystaltidessmp.net
      BEHIND_PROXY: 'true'
      APP_NAME: 'CrystalTides SMP'
      APP_LOGO: 'https://crystaltidessmp.net/images/ui/logo.webp'
      TRUSTED_PROXIES: 172.16.0.0/12 # ponytail: Docker bridge range
      APP_TIMEZONE: America/Santiago
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: pelican
      DB_USERNAME: pelican
      DB_PASSWORD: ${PELICAN_DB_PASSWORD:?PELICAN_DB_PASSWORD must be set}
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: cache
    volumes:
      - panel-data:/var/www/html/storage
    mem_limit: 1g
    cpus: 1.50
    pids_limit: 256
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://127.0.0.1:80/ || curl -fsS http://127.0.0.1:8080/ || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - pelican-network

  # 🗺️ FRP Server (Fast Reverse Proxy)
  frps:
    image: fatedier/frps:v0.54.0
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      FRP_AUTH_TOKEN: ${FRP_AUTH_TOKEN:?FRP_AUTH_TOKEN must be set}
    ports:
      - '7000:7000' # FRP Control port (frpc connects here)
      - '25565:25565' # Minecraft proxy port (players connect here)
      - '8023:8023' # Local Spy proxy port (Discord Bot connects here)
      - '8022:8022' # Laptop SSH proxy port (Discord Bot connects here)
      - '2022:2022' # Wings SFTP proxy port (WinSCP connects here)
    volumes:
      - ./deploy/oracle-cloud/frps.toml:/etc/frp/frps.toml:ro
    command: ['-c', '/etc/frp/frps.toml']
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 128
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 7000 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - pelican-network

  # 🔑 HashiCorp Vault (Secrets Manager)
  vault:
    image: hashicorp/vault:1.15.0
    container_name: crystaltides-vault
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    command: ['vault', 'server', '-config=/vault/config/config.hcl']
    volumes:
      - vault-data:/vault/file
      - ./deploy/vault/config.hcl:/vault/config/config.hcl:ro
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 128
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "wget --no-verbose --tries=1 --spider 'http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200' || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - pelican-network

  # 🤖 Discord Bot
  bot:
    image: crystaltides-bot:${BOT_IMAGE_TAG:-1.0.0}
    container_name: crystaltides-bot
    user: '1001:1001'
    environment:
      PORT: 3002
      NODE_ENV: production
    env_file:
      - path: .env.bot
        required: true
    volumes:
      - ./id_minecraft_pem:/app/id_minecraft_pem:ro
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:3002/health || exit 1']
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - pelican-network

  # 🔒 Caddy (Automated SSL Reverse Proxy)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/oracle-cloud/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 128
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://127.0.0.1:2019/config/ || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      panel:
        condition: service_healthy
    networks:
      - pelican-network

networks:
  pelican-network:
    name: pelican-network

volumes:
  db-data:
  redis-data:
  panel-data:
  caddy-data:
  caddy-config:
  vault-data:
