# Dev-only compatibility runs (-PcompatTest), from maven.modrinth. Sodium 0.6.9 and Iris 1.8.8 are
# the pair Iris was released against for 1.21.1.
# Fabric API from the same week as Sodium 0.6.9: newer ones break Sodium 0.6's FRAPI renderer (BlendMode)
compat_fabric_api_version=0.115.1+1.21.1
compat_sodium_version=mc1.21.1-0.6.9
compat_iris_version=1.8.8+1.21.1
# Same period as Sodium 0.6.9 / Iris 1.8.8; ImmediatelyFast 1.6.x is built with Loom 1.17 and Loom 1.8 cannot remap it
compat_immediatelyfast_version=1.3.5+1.21.1
# Dynamic FPS 3.11.4 reuses one version number per loader: pinned by Modrinth version ID
compat_dynamic_fps_fabric=GBH14HiF
compat_dynamic_fps_neoforge=T238FZpQ

# Gradle JVM
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
