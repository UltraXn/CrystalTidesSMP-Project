plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    // Fabric Loader ships MixinExtras at runtime (no jar-in-jar needed). Its annotation processor is
    // what adds the @ModifyReturnValue / @WrapWithCondition targets to the Intermediary refmap.
    compileOnly "io.github.llamalad7:mixinextras-fabric:${mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-fabric:${mixinextras_version}"
}

// Dev-only compatibility runs (never part of the jar or CI):
//   ./gradlew :fabric:runClient -PcompatTest                     Sodium + Iris
//   ./gradlew :fabric:runClient -PcompatTest -PcompatDynamicFps  ...plus Dynamic FPS (eco mode must switch off)
// ImmediatelyFast is exercised in the NeoForge run: under Loom's dev runtime its jar-in-jar library
// (net.lenni0451:Reflect) is not on the classpath and its Iris integration fails to initialize.
if (project.hasProperty('compatTest')) {
    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Modrinth'
                    url = 'https://api.modrinth.com/maven'
                }
            }
            filter { includeGroup('maven.modrinth') }
        }
    }
    dependencies {
        modLocalRuntime "net.fabricmc.fabric-api:fabric-api:${compat_fabric_api_version}"
        modLocalRuntime "maven.modrinth:sodium:${compat_sodium_version}-fabric"
        modLocalRuntime "maven.modrinth:iris:${compat_iris_version}-fabric"
        if (project.hasProperty('compatDynamicFps')) {
            modLocalRuntime "maven.modrinth:dynamic-fps:${compat_dynamic_fps_fabric}"
        }
    }
}

loom {
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            vmArg('-Dmixin.debug.verbose=true')
            // -PmixinExport: dumps transformed classes to runs/client/.mixin.out
            if (project.hasProperty('mixinExport')) {
                vmArg('-Dmixin.debug.export=true')
            }
            // -PmixinStrict: injections without targets become errors, even optional ones (require = 0).
            // Do not combine with -PcompatTest: Sodium's NeoForge-only injectors are optional on Fabric.
            if (project.hasProperty('mixinStrict')) {
                vmArg('-Dmixin.debug.countInjections=true')
            }
            // -PagentJar=<path>/game-bridge.jar: attach the launcher agent to exercise the telemetry mixins
            if (project.hasProperty('agentJar')) {
                vmArg("-javaagent:${project.property('agentJar')}")
            }
            // -PquickPlay=<host:port>: connect on startup (opens a client Netty connection for NettyQosMixin)
            if (project.hasProperty('quickPlay')) {
                programArgs('--quickPlayMultiplayer', project.property('quickPlay').toString())
            }
            // -PquickPlayWorld=<save folder>: open that singleplayer world on startup (benchmarks)
            if (project.hasProperty('quickPlayWorld')) {
                programArgs('--quickPlaySingleplayer', project.property('quickPlayWorld').toString())
            }
            // -PjvmArgs="<args separated by spaces>": extra JVM flags, e.g. the launcher's GC setup for benchmarks
            if (project.hasProperty('jvmArgs')) {
                project.property('jvmArgs').toString().trim().split(/\s+/).each { vmArg(it) }
            }
            // -PjfrFile=<path>.jfr: Java Flight Recorder profile, from 50 s after JVM start (past loading)
            // for 150 s; the file is written when the recording ends, even if the game is killed later
            if (project.hasProperty('jfrFile')) {
                vmArg("-XX:StartFlightRecording=filename=${project.property('jfrFile')},settings=profile,delay=50s,duration=150s")
            }
        }
    }
}
