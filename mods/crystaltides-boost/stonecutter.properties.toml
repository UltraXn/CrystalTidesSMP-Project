# Build properties for every node (see settings.gradle.kts). Sections are matched by the node's tags,
# its Minecraft version and its loader: ["1.21.1"], [fabric], [fabric."1.21.1"]...
mod.version = "1.1.0"

# Compile-time Fabric Loader for every version; the runtime minimum is mod.fabric_loader_min
deps.fabric_loader = "0.19.5"
loomx.loom_version = "1.19.1"
# Fabric Loader and NeoForge ship MixinExtras at runtime; the mod only uses its 0.4 API
deps.mixinextras = "0.4.1"

[fabric]
mod.id = "crystaltides-boost"
mod.fabric_loader_min = ">=0.16.0"

[neoforge]
mod.id = "crystaltides_boost"

# --- 1.21 - 1.21.1 -----------------------------------------------------------------------------
["1.21.1"]
mod.mc_releases = ["1.21", "1.21.1"]
# Dev-only compatibility runs (-PcompatTest): Sodium 0.6.9 and Iris 1.8.8 are the pair Iris was
# released against for 1.21.1; ImmediatelyFast from the same period (NeoForge only, see build.fabric.gradle.kts)
compat.sodium = "mc1.21.1-0.6.9"
compat.iris = "1.8.8+1.21.1"
compat.immediatelyfast = "1.3.5+1.21.1"

[fabric."1.21.1"]
mod.mc_compat = ">=1.21 <=1.21.1"
# Fabric API from the same week as Sodium 0.6.9: newer ones break Sodium 0.6's FRAPI renderer
compat.fabric_api = "0.115.1+1.21.1"
# Dynamic FPS 3.11.4 reuses one version number per loader: pinned by Modrinth version ID
compat.dynamic_fps = "GBH14HiF"

[neoforge."1.21.1"]
mod.mc_compat = "[1.21,1.21.2)"
mod.neoforge_compat = "[21.0,21.2)"
deps.neoforge = "21.1.262"
compat.dynamic_fps = "T238FZpQ"

