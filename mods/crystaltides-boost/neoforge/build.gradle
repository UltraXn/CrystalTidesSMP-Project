plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    runs {
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', 'crystaltides_boost'
            jvmArgument '-Dmixin.debug.verbose=true'
        }
        client {
            client()
        }
    }
    mods {
        crystaltides_boost {
            sourceSet sourceSets.main
        }
    }
}
