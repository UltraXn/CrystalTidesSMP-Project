modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/CrystalTides/crystaltides/issues"

[[mods]]
modId = "crystaltides_boost"
version = "${version}"
displayName = "CrystalTides Boost"
authors = "CrystalTides Team"
description = '''
Multiloader client-side performance mod: render, sound and network thread QoS, background eco mode (minimized / unfocused FPS caps) and animated texture culling. Compatible with Sodium, Embeddium, Iris, Oculus and ImmediatelyFast.
'''

[[mixins]]
config = "crystaltides-boost.common.mixins.json"

[[dependencies.crystaltides_boost]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,21.2)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.crystaltides_boost]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "CLIENT"
