name: CI Quality Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Codebase
        run: pnpm turbo run lint

      - name: Run Unit Tests
        run: pnpm turbo run test

      - name: Dry Run Build
        run: pnpm turbo run build --filter=...[HEAD^1]
        # Validates that changes build correctly without needing to deploy

  rust-check:
    name: Rust Backend QA (launcher-lite)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Check Formatting
        working-directory: apps/launcher-lite/src-tauri
        run: cargo fmt --check

      - name: Clippy Linter
        working-directory: apps/launcher-lite/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Security & Dependency Audit
        working-directory: apps/launcher-lite/src-tauri
        run: cargo deny check advisories

      - name: Verify ct-agent.dll compilation (MSVC x64)
        if: matrix.os == 'windows-latest'
        working-directory: apps/launcher-lite/native/ct-agent
        shell: pwsh
        run: |
          $jdk = if ($env:JAVA_HOME_21_X64) { $env:JAVA_HOME_21_X64 } else { $env:JAVA_HOME }
          .\build.ps1 -JdkPath $jdk
          $dumpbinCmd = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          $headers = if ($dumpbinCmd) {
            dumpbin /headers ct-agent.dll
          } else {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
            cmd /c "call `"$vcvars`" >nul && dumpbin /headers ct-agent.dll"
          }
          if (($headers -join "`n") -notmatch "machine \(x64\)") {
            Write-Error "ct-agent.dll is not x64 architecture!"
            exit 1
          }
