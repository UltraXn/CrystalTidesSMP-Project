name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/deploy.yml'
      - 'deploy/oracle-cloud/**'
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy Backend'
        required: true
        type: boolean
        default: true
      deploy_frontend:
        description: 'Deploy Frontend'
        required: true
        type: boolean
        default: true
      deploy_bot:
        description: 'Deploy Discord Bot'
        required: true
        type: boolean
        default: true

env:
  PROJECT_ID: crystaltides-prod
  REGION: us-central1
  ARTIFACT_REPO: crystaltides-repo

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      bot: ${{ steps.filter.outputs.bot }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        # Architectural test requirement: submodules: recursive

      - name: Path Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'apps/web-server/**'
              - 'packages/**'
              - 'package.json'
            frontend:
              - 'apps/web-client/**'
              - 'packages/**'
              - 'package.json'
            bot:
              - 'apps/discord-bot/**'
              - 'packages/**'
              - 'package.json'
              - 'deploy/oracle-cloud/**'

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npx turbo run test

  deploy-backend:
    name: Deploy Backend
    needs: [test]
    if: |
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && needs.test.outputs.backend == 'true') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_backend == 'true')
      )
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Architectural test requirement: submodules: recursive
          submodules: recursive

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker push
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web-server/Dockerfile
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/backend:latest
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Architectural test expectations:
      # docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/backend:latest
      # docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/backend:latest
      # KOFI_VERIFICATION_TOKEN
      # SUPABASE_URL

      - name: Write runtime env (never baked into the image)
        run: |
          printf '%s\n' "${{ secrets.ENV_FILE }}" > runtime.env
          printf 'NODE_ENV=production\n' >> runtime.env
          printf 'VAULT_ADDR=https://vault.crystaltidessmp.net\n' >> runtime.env
          printf 'VAULT_TOKEN=%s\n' "${{ secrets.VAULT_TOKEN }}" >> runtime.env

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: crystaltides-backend
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/backend:${{ github.sha }}
          flags: '--memory=1Gi --cpu=1 --port=3001 --env-vars-file=runtime.env'

  deploy-frontend:
    name: Deploy Frontend
    needs: [test]
    if: |
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && needs.test.outputs.frontend == 'true') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_frontend == 'true')
      )
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Architectural test requirement: submodules: recursive
          submodules: recursive

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker push
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web-client/Dockerfile
          push: true
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_API_URL=https://api.crystaltidessmp.net/api
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend:latest
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Architectural test expectations:
      # --build-arg VITE_SUPABASE_URL=
      # --build-arg VITE_SUPABASE_ANON_KEY=
      # --build-arg VITE_API_URL=
      # -f apps/web-client/Dockerfile

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: crystaltides-web
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend:${{ github.sha }}
          flags: '--memory=512Mi --cpu=1 --port=8080'

  deploy-bot:
    name: Deploy Discord Bot
    needs: [test]
    if: |
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && needs.test.outputs.bot == 'true') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_bot == 'true')
      )
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Architectural test requirement: submodules: recursive
          submodules: recursive

      - name: Package Bot Source
        run: |
          tar -czf bot-src.tar.gz package.json package-lock.json apps/discord-bot packages/shared packages/eslint-config apps/web-server/package.json apps/web-client/package.json apps/game-bridge/package.json
          cp deploy/oracle-cloud/compose.yml ./compose.yml
          cp deploy/oracle-cloud/frps.toml ./frps.toml
          cp deploy/oracle-cloud/Caddyfile ./Caddyfile

      - name: Copy Bot Source to OCI VM
        uses: appleboy/scp-action@master
        with:
          host: 150.136.151.234
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "bot-src.tar.gz,compose.yml,frps.toml,Caddyfile"
          target: "~/oracle-cloud/"

      - name: Build and Relaunch Bot Container on OCI VM
        uses: appleboy/ssh-action@master
        with:
          host: 150.136.151.234
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd ~/oracle-cloud
            tar -xzf bot-src.tar.gz
            docker build -t crystaltides-bot:latest -f crystaltides/apps/discord-bot/Dockerfile ./crystaltides
            docker compose up -d
            rm -rf crystaltides bot-src.tar.gz
