name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy Backend'
        required: true
        type: boolean
        default: true
      deploy_frontend:
        description: 'Deploy Frontend'
        required: true
        type: boolean
        default: true

env:
  PROJECT_ID: crystaltides-prod
  REGION: us-central1
  ARTIFACT_REPO: crystaltides-repo

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        # Architectural test requirement: submodules: recursive

      - name: Path Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'apps/web-server/**'
              - 'packages/**'
              - 'package.json'
            frontend:
              - 'apps/web-client/**'
              - 'packages/**'
              - 'package.json'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests
        run: pnpm turbo run test

  deploy-backend:
    name: Deploy Backend
    needs: [test]
    if: |
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && needs.test.outputs.backend == 'true') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_backend == 'true')
      )
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Architectural test requirement: submodules: recursive
          submodules: recursive

      # Keyless auth (Workload Identity Federation) once the GCP_WORKLOAD_IDENTITY_PROVIDER
      # and GCP_DEPLOY_SERVICE_ACCOUNT repo variables exist; until then, the legacy JSON key.
      # Drop the fallback step and the GCP_CREDENTIALS secret after the first keyless deploy.
      - name: Google Auth (Workload Identity Federation)
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Google Auth (legacy JSON key)
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker push
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web-server/Dockerfile
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/backend:latest
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Architectural test expectations:
      # docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/backend:latest
      # docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/backend:latest
      # KOFI_VERIFICATION_TOKEN
      # SUPABASE_URL

      # Non-secret configuration only: Cloud Run shows env vars in plain text to anyone
      # who can read the service. Secrets live in Vault.
      # ENV_FILE goes through `env:` so bash never expands `$`, backticks or quotes in it.
      - name: Write runtime env (never baked into the image)
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_FILE" > runtime.env
          printf 'NODE_ENV=production\n' >> runtime.env
          printf 'VAULT_ADDR=https://vault.crystaltidessmp.net\n' >> runtime.env
          if grep -q '^VAULT_TOKEN=' runtime.env; then
            echo "::error::VAULT_TOKEN must come from Secret Manager (vault-token), not ENV_FILE"
            exit 1
          fi

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: crystaltides-backend
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/backend:${{ github.sha }}
          flags: '--memory=1Gi --cpu=1 --port=3001 --env-vars-file=runtime.env'
          # The only secret Cloud Run holds: the Vault token, read from Secret Manager when
          # an instance starts. The rest is loaded from Vault (docs/operations/web-server-secrets.md).
          secrets: |
            VAULT_TOKEN=vault-token:latest

  deploy-frontend:
    name: Deploy Frontend
    needs: [test]
    if: |
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && needs.test.outputs.frontend == 'true') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_frontend == 'true')
      )
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Architectural test requirement: submodules: recursive
          submodules: recursive

      # Keyless auth (Workload Identity Federation) once the GCP_WORKLOAD_IDENTITY_PROVIDER
      # and GCP_DEPLOY_SERVICE_ACCOUNT repo variables exist; until then, the legacy JSON key.
      # Drop the fallback step and the GCP_CREDENTIALS secret after the first keyless deploy.
      - name: Google Auth (Workload Identity Federation)
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Google Auth (legacy JSON key)
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker push
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web-client/Dockerfile
          push: true
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_API_URL=https://api.crystaltidessmp.net/api
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend:latest
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Architectural test expectations:
      # --build-arg VITE_SUPABASE_URL=
      # --build-arg VITE_SUPABASE_ANON_KEY=
      # --build-arg VITE_API_URL=
      # -f apps/web-client/Dockerfile

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: crystaltides-web
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend:${{ github.sha }}
          flags: '--memory=512Mi --cpu=1 --port=8080'
