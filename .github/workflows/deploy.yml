name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: crystaltides-prod
  REGION: us-central1
  ARTIFACT_REPO: crystaltides-repo

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          submodules: recursive

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker push
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > apps/web-server/.env

      - name: Build and Push Container
        run: |-
          IMAGE_NAME=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/backend
          docker build -t $IMAGE_NAME:latest -f apps/web-server/Dockerfile .
          docker push $IMAGE_NAME:latest

          # Clean up untagged images to save on storage and scanning costs
          gcloud artifacts docker images list $IMAGE_NAME --filter="NOT tags:*" --format="get(digest)" --limit=20 | xargs -r gcloud artifacts docker images delete --quiet

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: crystaltides-backend
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/backend:latest
          flags: '--memory=256Mi --cpu=0.5 --max-instances=5 --concurrency=1'
          env_vars: |
            NODE_ENV=production
            MC_SERVER_HOST=147.135.9.233
            MC_SERVER_PORT=26408
            SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            KOFI_VERIFICATION_TOKEN=${{ secrets.KOFI_VERIFICATION_TOKEN }}

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          submodules: recursive

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker push
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Container
        run: |-
          IMAGE_NAME=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend
          docker build \
            --build-arg VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }} \
            --build-arg VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }} \
            --build-arg VITE_API_URL=https://api.crystaltidessmp.net/api \
            -t $IMAGE_NAME:latest \
            -f apps/web-client/Dockerfile .
          docker push $IMAGE_NAME:latest

          # Clean up untagged images
          gcloud artifacts docker images list $IMAGE_NAME --filter="NOT tags:*" --format="get(digest)" --limit=20 | xargs -r gcloud artifacts docker images delete --quiet

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: crystaltides-web
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend:latest
          flags: '--memory=128Mi --cpu=0.2 --max-instances=5 --concurrency=1'

  deploy-bot:
    name: Deploy Discord Bot
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          submodules: recursive

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > apps/discord-bot/.env

      - name: Install Dependencies (Bot)
        working-directory: ./apps/discord-bot
        run: bun install

      - name: Register Slash Commands
        working-directory: ./apps/discord-bot
        run: bun run src/deploy-commands.ts

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker push
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Container
        run: |-
          IMAGE_NAME=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/bot
          docker build -t $IMAGE_NAME:latest -f apps/discord-bot/Dockerfile .
          docker push $IMAGE_NAME:latest

          # Clean up untagged images
          gcloud artifacts docker images list $IMAGE_NAME --filter="NOT tags:*" --format="get(digest)" --limit=20 | xargs -r gcloud artifacts docker images delete --quiet

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: crystaltides-bot
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/bot:latest
          # Bot needs to be always on, but with minimal resources
          flags: '--min-instances=1 --memory=512Mi --cpu=1 --max-instances=5 --concurrency=1'
          env_vars: |
            NODE_ENV=production
