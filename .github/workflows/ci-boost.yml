name: CI | CrystalTides Boost Mod

on:
  push:
    branches: [main, develop]
    paths:
      - mods/crystaltides-boost/**
      - .github/workflows/ci-boost.yml
  pull_request:
    branches: [main, develop]
    paths:
      - mods/crystaltides-boost/**
      - .github/workflows/ci-boost.yml
  workflow_dispatch:

# Un push nuevo a la misma rama o PR cancela la ejecución en curso
concurrency:
  group: ci-boost-${{ github.ref }}
  cancel-in-progress: true

env:
  # Gradle se ejecuta con Java 25 (gradle/gradle-daemon-jvm.properties) y los nodos compilan con Java 21
  # (1.21.x) o 25 (26.x): se usan como toolchains los JDK de setup-java en vez de descargar otros.
  GRADLE_TOOLCHAINS: -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64 -Porg.gradle.java.installations.auto-download=false

jobs:
  versions:
    name: Version groups
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
      fabric-tasks: ${{ steps.read.outputs.fabric-tasks }}
      runtime: ${{ steps.read.outputs.runtime }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            mods/crystaltides-boost/settings.gradle.kts
            mods/crystaltides-boost/stonecutter.properties.toml
          sparse-checkout-cone-mode: false

      # Los grupos viven en settings.gradle.kts (match("1.21.1", "fabric", "neoforge") ...) y las versiones de
      # Minecraft que cubre cada uno en stonecutter.properties.toml (mod.mc_releases): se leen de ahí
      - name: Read the version groups
        id: read
        working-directory: mods/crystaltides-boost
        run: |
          versions=$(grep -oP '^\s*match\("\K[^"]+' settings.gradle.kts)
          test -n "$versions"
          echo "list=$(printf '%s\n' $versions | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
          echo "fabric-tasks=$(printf ':%s-fabric:build ' $versions)" >> "$GITHUB_OUTPUT"
          python3 - "$versions" <<'EOF' >> "$GITHUB_OUTPUT"
          import json, sys, tomllib
          with open("stonecutter.properties.toml", "rb") as handle:
              props = tomllib.load(handle)
          runs = []
          for group in sys.argv[1].split():
              java = 25 if int(group.split(".")[0]) >= 26 else 21
              for mc in props[group]["mod"]["mc_releases"]:
                  for loader in ("fabric", "neoforge"):
                      runs.append({"mc": mc, "group": group, "loader": loader, "java": java})
          print("runtime=" + json.dumps(runs))
          EOF

  fabric:
    name: Fabric (all versions) + tests
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mods/crystaltides-boost
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java 21 + 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # El último queda como JAVA_HOME: Gradle necesita el 25
          java-version: |
            21
            25

      # Cachea los jars de Minecraft y los mappings de Loom; los PR solo leen la caché
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # Cada nodo Fabric ejecuta los tests unitarios (no dependen del loader)
      - name: Build & Test
        run: ./gradlew ${{ needs.versions.outputs.fabric-tasks }} --console=plain $GRADLE_TOOLCHAINS

      # 1.21.x está ofuscado y Loom remapea las anotaciones de los mixins en el bytecode (sin refmap):
      # un nombre de Mojang que quede ahí fallaría en un Fabric de producción
      - name: Check the mixin remapping (1.21.x)
        run: python3 -I tools/check_remap.py $(ls versions/1.21*-fabric/build/libs/*.jar | grep -v -- -sources)

      - name: Upload the Fabric jars
        uses: actions/upload-artifact@v4
        with:
          name: crystaltides-boost-fabric
          path: |
            mods/crystaltides-boost/versions/*-fabric/build/libs/crystaltides-boost-fabric-*.jar
            !mods/crystaltides-boost/versions/*/build/libs/*-sources.jar
          if-no-files-found: error

  neoforge:
    name: NeoForge ${{ matrix.version }}
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.list) }}
    defaults:
      run:
        working-directory: mods/crystaltides-boost
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java 21 + 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      # Cachea el Minecraft decompilado y parcheado de esta versión; los PR solo leen la caché
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # Un nodo por runner: NeoForm decompila Minecraft con Vineflower, que reserva max(4 GB, 256 MB por
      # núcleo) de heap, así que el daemon de Gradle va con menos memoria que en local
      - name: Build
        run: ./gradlew :${{ matrix.version }}-neoforge:build --console=plain -Dorg.gradle.jvmargs=-Xmx2g $GRADLE_TOOLCHAINS

      - name: Upload the NeoForge jar
        uses: actions/upload-artifact@v4
        with:
          name: crystaltides-boost-neoforge-${{ matrix.version }}
          path: |
            mods/crystaltides-boost/versions/${{ matrix.version }}-neoforge/build/libs/crystaltides-boost-neoforge-*.jar
            !mods/crystaltides-boost/versions/*/build/libs/*-sources.jar
          if-no-files-found: error

  # Arranca el cliente real (HeadlessMC + Xvfb, sin GPU) en cada versión de Minecraft con el jar de su grupo:
  # el mod de prueba entra en un mundo de singleplayer, espera a que carguen los chunks y cierra el juego
  runtime:
    name: Runtime ${{ matrix.loader }} ${{ matrix.mc }}
    needs: [versions, fabric, neoforge]
    # También si falla el build de algún nodo: el resto de versiones se prueba igual
    if: ${{ !cancelled() && needs.versions.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.runtime) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: mods/crystaltides-boost/tools
          sparse-checkout-cone-mode: false

      # El juego usa el JAVA_HOME que haya al empezar mc-runtime-test
      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Download the mod jar
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.loader == 'fabric' && 'crystaltides-boost-fabric' || format('crystaltides-boost-neoforge-{0}', matrix.group) }}
          path: artifact

      # mc-runtime-test-mod no publica 1.21.2 ni 1.21.9: se usa el de su grupo (1.21.3, 1.21.10), que
      # declara ~1.21.0 en Fabric y [1.21.0,) en NeoForge
      - name: Stage the mod and the test mod
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p run/mods
          jar=$(find artifact -name "crystaltides-boost-${{ matrix.loader }}-${{ matrix.group }}-*.jar" ! -name "*-sources.jar" | head -1)
          test -n "$jar"
          cp "$jar" run/mods/
          for tm in "${{ matrix.mc }}" "${{ matrix.group }}"; do
            gh release download "$tm-latest" --repo headlesshq/mc-runtime-test-mod \
              --pattern "mc-runtime-test-$tm-${{ matrix.loader }}-*.jar" --dir run/mods && break
          done
          ls -l run/mods
          test "$(ls run/mods | grep -c '^mc-runtime-test-')" -eq 1

      - name: Run Minecraft ${{ matrix.mc }} (${{ matrix.loader }})
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: ${{ matrix.mc }}
          modloader: ${{ matrix.loader }}
          # El mod de prueba ya está en run/mods
          mc-runtime-test: none
          java: ${{ matrix.java }}
          # 34 cachés de .minecraft desplazarían a las de Gradle (límite de 10 GB por repositorio)
          cache-mc: "false"

      - name: Check the game log
        run: python3 -I mods/crystaltides-boost/tools/check_runtime_log.py run/logs/latest.log --group ${{ matrix.group }}

      - name: Upload the game log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-log-${{ matrix.loader }}-${{ matrix.mc }}
          path: |
            run/logs/latest.log
            run/crash-reports/
          if-no-files-found: ignore
