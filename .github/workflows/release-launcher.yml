name: Release | Launcher Suite

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            label: Linux
          - platform: windows-latest
            label: Windows
          - platform: macos-latest
            label: macOS

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@9399c7bb15dca21d154c549629122736449bd0aa # v1.11.0
        with:
          toolchain: stable
          cache: true

      - name: Install Linux dependencies
        if: matrix.label == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      # ── CTLauncher (Client) ──────────────────────────────
      - name: Build & Upload — CrystalTides Launcher
        uses: tauri-apps/tauri-action@0e5a3cbb8543e018ab19fbca54abb78a42e2b284 # v0.5.22
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/launcher/client
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'CTLauncher ${{ env.RELEASE_TAG }}'
          releaseBody: |
            ## 🌊 CTLauncher ${{ env.RELEASE_TAG }}

            Descarga el **instalador** para tu plataforma y estarás listo.

            | Plataforma | Archivo |
            |------------|---------|
            | Windows    | `CTLauncher-Installer_x64-setup.exe` |
            | Linux      | `CTLauncher-Installer_amd64.AppImage` / `.deb` |
            | macOS      | `CTLauncher-Installer_x64.dmg` |
          releaseDraft: true
          prerelease: false

      # ── CTLauncher Installer ─────────────────────────────
      - name: Build & Upload — CTLauncher Installer
        uses: tauri-apps/tauri-action@0e5a3cbb8543e018ab19fbca54abb78a42e2b284 # v0.5.22
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/launcher/installer
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'CTLauncher ${{ env.RELEASE_TAG }}'
          releaseDraft: true
          prerelease: false

      # ── CTLauncher Uninstaller ───────────────────────────
      - name: Build & Upload — CTLauncher Uninstaller
        uses: tauri-apps/tauri-action@0e5a3cbb8543e018ab19fbca54abb78a42e2b284 # v0.5.22
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/launcher/uninstaller
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'CTLauncher ${{ env.RELEASE_TAG }}'
          releaseDraft: true
          prerelease: false
