name: TestSprite Autonomous Testing

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/web-client/**'
      - 'packages/**'

jobs:
  test-ai:
    name: TestSprite AI Test Cycle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 24
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c483a26c6c # v4.2.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run TestSprite
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
        run: |
          if [ -z "$TESTSPRITE_API_KEY" ]; then
            echo "Error: TESTSPRITE_API_KEY is not set in GitHub Secrets."
            exit 1
          fi
          npx @testsprite/testsprite-mcp@latest generateCodeAndExecute
