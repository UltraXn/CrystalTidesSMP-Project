name: CI | Native Components

on:
  push:
    branches: [main, develop]
    paths:
      - apps/launcher/**
  pull_request:
    branches: [main, develop]
    paths:
      - apps/launcher/**

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  native-qa:
    name: Verify (Rust & Tauri)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Rust workspace
        working-directory: apps/launcher
        run: |
          cargo check
          cargo test

      - name: TypeScript check — Launcher Client
        working-directory: apps/launcher/client
        run: pnpm tsc --noEmit

      - name: TypeScript check — Launcher Installer
        working-directory: apps/launcher/installer
        run: pnpm tsc --noEmit

      - name: TypeScript check — Launcher Uninstaller
        working-directory: apps/launcher/uninstaller
        run: pnpm tsc --noEmit
