name: CI | Native Components

on:
  push:
    branches: [main, develop]
    paths:
      - apps/game-bridge/**
      - apps/launcher/**
  pull_request:
    branches: [main, develop]
    paths:
      - apps/game-bridge/**
      - apps/launcher/**

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  native-qa:
    name: Verify (Rust & Tauri)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Verify Rust workspace
        working-directory: apps/launcher
        run: |
          cargo check
          cargo test

      - name: TypeScript check — Launcher Client
        working-directory: apps/launcher/client
        run: npx tsc --noEmit

      - name: TypeScript check — Launcher Installer
        working-directory: apps/launcher/installer
        run: npx tsc --noEmit

      - name: TypeScript check — Launcher Uninstaller
        working-directory: apps/launcher/uninstaller
        run: npx tsc --noEmit
