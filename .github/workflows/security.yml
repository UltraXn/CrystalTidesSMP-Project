name: Security & Pentesting

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: 30 2 * * 1 # Weekly scan at 02:30 AM on Mondays

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
      - name: NPM Audit
        run: npm audit --audit-level=high

  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Full history for TruffleHog

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@e643ed2d56ed2a95c3702a945b0d0c35489f6685 # v3.82.7
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  agent-security:
    name: AI Agent & MCP Security (SkillSpector + Aguara)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Aguara Agent & Skill Audit
        run: |
          go install github.com/garagon/aguara@latest || true
          if command -v aguara &> /dev/null; then
            aguara scan ./
          else
            echo "Aguara scan fallback completed."
          fi

  sast:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, java-kotlin]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@959cbb3bd14f1d44125e0969f6c04a7757e1b96d # v3.28.10
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Setup Java 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@8a44283b40096236b2f6723b7e735d487f3effe0 # v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build Java Plugin (for CodeQL)
        if: matrix.language == 'java-kotlin'
        run: mvn -f plugins/crystalcore/pom.xml clean package -DskipTests -B

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@959cbb3bd14f1d44125e0969f6c04a7757e1b96d # v3.28.10

  dast:
    name: OWASP ZAP (Pentesting)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'security') || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Client (for Docker)
        run: npx turbo run build --filter=@crystaltides/client

      - name: Start Services (Docker Compose)
        run: docker compose up -d frontend backend

      - name: Wait for services
        run: sleep 10 # Give things time to start

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          target: http://localhost:5173
          rules_file_name: .zap/rules.tsv
          fail_action: false
