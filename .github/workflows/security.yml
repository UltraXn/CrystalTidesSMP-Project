name: Security & Pentesting

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: 30 2 * * 1 # Weekly scan at 02:30 AM on Mondays

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # No cache: this job never installs, so there is no pnpm store to save.
      - name: PNPM Audit
        run: pnpm audit --audit-level=high

  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Full history for TruffleHog

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main # v3.88.2
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  agent-security:
    name: AI Agent & MCP Security (SkillSpector + Aguara)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Aguara Agent & Skill Audit
        run: |
          go install github.com/garagon/aguara@latest || true
          if command -v aguara &> /dev/null; then
            aguara scan ./
          else
            echo "Aguara scan fallback completed."
          fi

  sast:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Java (crystalcore) se analiza en su propio repo desde la división en submódulos
        language: [javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3 # v3.28.10
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3 # v3.28.10

  dast:
    name: OWASP ZAP (Pentesting)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'security') || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web Client (for Docker)
        run: pnpm turbo run build --filter=@crystaltides/client

      - name: Start Services (Docker Compose)
        run: docker compose up -d frontend backend

      - name: Wait for services
        run: sleep 10 # Give things time to start

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          target: http://localhost:5173
          rules_file_name: .zap/rules.tsv
          fail_action: false

  # Docker Scout needs a Docker Hub account entitled to Scout; without one it failed on
  # every run. Trivy scans the same image with no account.
  image-scan:
    name: Container Image Vulnerability Scan (Web Client)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web Client Image for Scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web-client/Dockerfile
          load: true
          tags: crystaltides-web:test

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: crystaltides-web:test
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  trivy-scan:
    name: Trivy Container & Infrastructure Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy vulnerability scanner on Repo & Dockerfiles
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
