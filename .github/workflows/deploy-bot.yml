name: Deploy | Discord Bot (Oracle VPS)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/discord-bot/**'
      - '.github/workflows/deploy-bot.yml'
      - 'deploy/oracle-cloud/**'
  workflow_dispatch:

jobs:
  typecheck-bot:
    name: Typecheck Discord Bot
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck Discord Bot
        working-directory: apps/discord-bot
        run: npx tsc --noEmit

  deploy-bot:
    name: Deploy Discord Bot to Oracle VPS
    needs: [typecheck-bot]
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false

      - name: Package Bot Source
        run: |
          tar -czf bot-src.tar.gz package.json package-lock.json apps/discord-bot packages/shared packages/eslint-config apps/web-server/package.json apps/web-client/package.json apps/game-bridge/package.json
          cp deploy/oracle-cloud/compose.yml ./compose.yml
          cp deploy/oracle-cloud/frps.toml ./frps.toml
          cp deploy/oracle-cloud/Caddyfile ./Caddyfile

      - name: Copy Bot Source to OCI VM
        uses: appleboy/scp-action@master
        with:
          host: 150.136.151.234
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "bot-src.tar.gz,compose.yml,frps.toml,Caddyfile"
          target: "~/oracle-cloud/"

      - name: Build and Relaunch Bot Container on OCI VM
        uses: appleboy/ssh-action@master
        with:
          host: 150.136.151.234
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd ~/oracle-cloud
            tar -xzf bot-src.tar.gz
            docker build -t crystaltides-bot:latest -f crystaltides/apps/discord-bot/Dockerfile ./crystaltides
            docker compose up -d
            rm -rf crystaltides bot-src.tar.gz
