name: CI | Web Components

on:
  push:
    branches: [main, develop]
    paths:
      - apps/web-client/**
      - apps/web-server/**
  pull_request:
    branches: [main, develop]
    paths:
      - apps/web-client/**
      - apps/web-server/**

jobs:
  web-qa:
    name: Lint, Test & Build (Web)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint (Web)
        run: npx turbo run lint --filter=@crystaltides/client --filter=@crystaltides/server

      - name: Test (Web)
        run: npx turbo run test --filter=@crystaltides/client --filter=@crystaltides/server

      - name: Build (Web)
        run: npx turbo run build --filter=@crystaltides/client --filter=@crystaltides/server
