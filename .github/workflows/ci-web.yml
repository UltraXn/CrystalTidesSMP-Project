name: CI | Web Components

on:
  push:
    branches: [main, develop]
    paths:
      - apps/web-client/**
      - apps/web-server/**
  pull_request:
    branches: [main, develop]
    paths:
      - apps/web-client/**
      - apps/web-server/**

jobs:
  web-qa:
    name: Lint, Typecheck & Unit Tests (Web)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Web)
        run: pnpm turbo run lint --filter=@crystaltides/client --filter=@crystaltides/server

      - name: Typecheck (Web Client)
        run: |
          cd apps/web-client
          pnpm tsc --noEmit

      - name: Unit & Component Tests (Web)
        run: |
          cd apps/web-client
          pnpm vitest run --poolOptions.forks.maxForks=4

      - name: Build (Web)
        run: pnpm turbo run build --filter=@crystaltides/client --filter=@crystaltides/server

  e2e-qa:
    name: Playwright E2E Golden Paths
    needs: web-qa
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          cd apps/web-client
          pnpm dlx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: |
          cd apps/web-client
          pnpm playwright test

      - name: Upload Playwright Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web-client/playwright-report/
          retention-days: 7
