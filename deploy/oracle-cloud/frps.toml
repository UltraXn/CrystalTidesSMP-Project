# =========================================================================
# 🗺️ Fast Reverse Proxy Server (FRPS) Configuration
# CrystalTides Minecraft & Node Ingress
# =========================================================================

bindPort = 7000

[auth]
# ⚠️ IMPORTANTE DE SEGURIDAD:
# Este token autentica los clientes FRP (Laptop de desarrollo, Termux en celular, etc.).
# Se inyecta dinámicamente desde la variable de entorno FRP_AUTH_TOKEN.
token = "{{ .Envs.FRP_AUTH_TOKEN }}"

# Rango estricto de puertos permitidos para tunelización (Evita secuestro de puertos reservados)
allowPorts = [
    { start = 8000, end = 9000 },
    { start = 25565, end = 25565 }
]
