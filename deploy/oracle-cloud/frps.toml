bindPort = 7000

[auth]
# ⚠️ IMPORTANTE DE SEGURIDAD:
# Este token autentica los clientes FRP (Laptop de desarrollo, Termux en celular, etc.).
# Si cambias este valor, debes actualizarlo también en:
# - deploy/oracle-cloud/frpc.toml.laptop
# - deploy/oracle-cloud/frpc.toml.phone
token = "CrystalTidesFRP2026"

# Rango estricto de puertos permitidos para tunelización (Evita secuestro de puertos reservados)
allowPorts = [
    { start = 8000, end = 9000 },
    { start = 25565, end = 25565 }
]
