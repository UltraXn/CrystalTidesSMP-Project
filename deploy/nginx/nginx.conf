server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Security Headers for GCP/Production (Hardened)
    server_tokens off;
    
    # HSTS Preload
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    
    # Anti-Clickjacking & MIME-Type sniffing
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # XSS Protection
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy (Advanced)
    # Permite scripts de dominios confiables (Google, Cloudflare, etc.) y previene inyección de scripts inline no seguros
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.google.com https://www.gstatic.com blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co wss://*.crystaltidessmp.net https://crystaltidessmp.net https://api.crystaltidessmp.net; frame-ancestors 'none';" always;

    # Permissions Policy (Privacy)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), xr-spatial-tracking=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para API con prioridad heredada
    location ^~ /api/ {
        resolver 8.8.8.8 valid=30s;
        set $backend_upstream "http://backend:3001";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
