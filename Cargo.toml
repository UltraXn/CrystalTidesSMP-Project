[workspace]
resolver = "2"
members = [
  "apps/game-bridge/native-core",
  "apps/launcher/client/src-tauri",
  "apps/launcher/installer/src-tauri",
  "apps/launcher/uninstaller/src-tauri",
  "apps/launcher-lite/src-tauri",
]

[profile.dev]
# Reduce el tamaño de .pdb y target/ hasta un 70% preservando stack traces con nombres de archivo y líneas
debug = 1
incremental = true

# Compila las librerías externas (Tauri, Serde, Tokio) optimizadas para que no generen símbolos masivos de debug
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
