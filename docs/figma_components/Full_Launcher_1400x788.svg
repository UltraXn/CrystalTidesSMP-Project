      <stop offset="50%" stop-color="#090510"/>
      <stop offset="100%" stop-color="#040206"/>
    </linearGradient>
    <linearGradient id="launchGrad" x1="0" y1="0" x2="290" y2="76" gradientUnits="userSpaceOnUse">
